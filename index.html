  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #0b0e14;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      overflow: hidden;
      cursor: pointer;
    }
    .card {
      width: 88%;
      max-width: 380px;
      padding: 30px 20px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .btn {
      display: block;
      width: 100%;
      margin-top: 24px;
      padding: 16px 0;
      background: #face15;
      color: #000000;
      font-size: 18px;
      font-weight: 800;
      text-decoration: none;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(250, 206, 21, 0.3);
    }
    .subtext {
      margin-top: 14px;
      font-size: 13px;
      color: #8b949e;
    }
  </style>
</head>
<body onclick="openEvent()">
  <div class="card">
    <div style="font-size: 22px; font-weight: bold; margin-bottom: 8px;">🌙 달밤의 야시장 털기</div>
    <div style="font-size: 14px; color: #e6edf3;">리워드 페이지로 이동합니다</div>

    const androidIntent = "intent://" + rawParams + "#Intent;scheme=snssdk473824;package=com.tiktok.portal;end;";

    // 2. 아이폰 / 웹용 틱톡 백업 주소
    const webFallback = "https://app-va.tiktokv.com/lite_redirect/?redirect_url=snssdk473824%3A%2F%2F" + rawParams;

    document.getElementById("goBtn").href = androidIntent;

    function openEvent() {
      const ua = navigator.userAgent.toLowerCase();
      if (ua.includes("android")) {
        location.href = androidIntent;
      } else {
        location.href = webFallback;
      }
    }

    // 진입 0.15초 뒤 백그라운드 자동 기동
    setTimeout(openEvent, 150);
  </script>
