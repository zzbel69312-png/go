<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Lite</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #000;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 18px 36px;
      background: #fe2c55;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h2>TikTok Lite 이벤트 페이지로 이동</h2>
  
  <!-- 자바스크립트 우회가 막힐 때를 대비한 HTML 순수 a 태그 (브라우저가 절대 차단 못 함) -->
  <a id="appLink" class="btn" href="snssdk1180://invite?url=https%3A%2F%2Flite.tiktok.com%2Ft%2FZS9UTKYL9hP6m-sYAix%2F">
    TikTok Lite 앱 열기
  </a>

  <script>
    const deepLink = "snssdk1180://invite?url=https%3A%2F%2Flite.tiktok.com%2Ft%2FZS9UTKYL9hP6m-sYAix%2F";
    const fallback = "https://lite.tiktok.com/t/ZS9UTKYL9hP6m-sYAix/";

    // 1. 페이지 로드 즉시 다이렉트 호출 시도
    location.href = deepLink;

    // 2. 1.5초 동안 앱 실행 실패(미설치 등) 시 일반 웹 링크로 대체
    setTimeout(function() {
      location.href = fallback;
    }, 1500);
  </script>
</body>
</html>
