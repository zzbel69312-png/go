<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Lite</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #010101;
      color: #fff;
      font-family: -apple-system, sans-serif;
      text-align: center;
    }
    .btn {
      display: inline-block;
      margin-top: 24px;
      padding: 16px 36px;
      background: linear-gradient(90deg, #fe2c55, #25f4ee);
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(254, 44, 85, 0.4);
    }
  </style>
</head>
<body onclick="launchApp()">
  <div style="font-size: 20px; font-weight: bold;">TikTok Lite 리워드 열기</div>
  
  <a id="targetBtn" class="btn" href="intent://lite.tiktok.com/t/ZS9UTKYL9hP6m-sYAix/#Intent;scheme=https;package=com.tiktok.portal;end;">
    앱으로 바로 이동
  </a>

  <script>
    const krIntent = "intent://lite.tiktok.com/t/ZS9UTKYL9hP6m-sYAix/#Intent;scheme=https;package=com.tiktok.portal;end;";
    const fallbackUrl = "https://lite.tiktok.com/t/ZS9UTKYL9hP6m-sYAix/";

    function launchApp() {
      const ua = navigator.userAgent.toLowerCase();
      if (ua.includes("android")) {
        location.href = krIntent;
      } else {
        location.href = fallbackUrl;
      }
    }

    // 진입 0.1초 후 즉시 한국판 앱 인텐트 호출
    setTimeout(launchApp, 100);
  </script>
</body>
</html>
