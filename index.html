<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Lite</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #010101;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      cursor: pointer;
    }
    .btn {
      margin-top: 24px;
      padding: 16px 36px;
      background: linear-gradient(90deg, #fe2c55, #25f4ee);
      color: #ffffff;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(254, 44, 85, 0.4);
    }
    .subtext {
      margin-top: 12px;
      font-size: 13px;
      color: #888888;
    }
  </style>
</head>
<body onclick="launchApp()">
  <div style="font-size: 20px; font-weight: bold;">TikTok Lite 리워드 열기</div>
  <button class="btn">앱으로 바로 이동</button>
  <div class="subtext">화면을 터치하면 바로 앱이 실행됩니다.</div>

  <script>
    const appIntent = "intent://lite.tiktok.com/t/ZS9UTKYL9hP6m-sYAix/#Intent;scheme=https;package=com.zhiliaoapp.musically.go;end;";
    const fallbackUrl = "https://lite.tiktok.com/t/ZS9UTKYL9hP6m-sYAix/";

    function launchApp() {
      const ua = navigator.userAgent.toLowerCase();
      if (ua.includes("android")) {
        location.href = appIntent;
      } else {
        location.href = fallbackUrl;
      }
    }

    // 진입 즉시 1차 자동 시도
    setTimeout(launchApp, 100);
  </script>
</body>
</html>
